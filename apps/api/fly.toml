# Ambiente de produção. Config de staging é fly.staging.toml (mesma forma,
# app diferente, sem manter máquina sempre ligada). Ver docs/deploy.md pro
# passo a passo de provisionamento — este arquivo sozinho não cria nada.
app = "reliability-tech-api"
primary_region = "gru"

[build]

# Sem `release_command`: ele sobe uma machine temporária só pra migração, e o
# plano do Fly usado aqui tem teto de 3 machines (Postgres + API + web), então
# todo deploy da API falhava com "reached its machine limit". A migração roda
# via `flyctl ssh console` dentro da machine já deployada — ver deploy.yml.

[env]
  NODE_ENV = "production"
  API_PREFIX = "api"
  # CORS_ORIGINS/JWT_EXPIRES_IN/etc ficam no default de apps/api/src/config/env.ts
  # até haver motivo pra sobrescrever. CORS_ORIGINS em especial precisa virar
  # a URL real do app web (`fly secrets set` ou aqui, sem segredo nenhum).

[http_service]
  internal_port = 3333
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/v1/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
