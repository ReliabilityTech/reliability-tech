name: Deploy

# Disparo manual só, de propósito: publica de verdade em staging/produção no
# Fly.io (roadmap 5.3) — sem revisão automática de push, ninguém quer isso
# disparando sozinho. Trocar pra `push: {tags: ['v*']}` quando o time achar
# que dá pra confiar no automático.
#
# Pré-requisito (uma vez só, fora deste arquivo — ver docs/deploy.md):
# - 2 apps Fly por serviço (reliability-tech-api[-staging],
#   reliability-tech-web[-staging]) e 2 clusters de Postgres, com
#   `fly postgres attach` feito em cada app de API.
# - Um ambiente `staging` e um `production` em Settings → Environments,
#   cada um com o secret FLY_API_TOKEN e a variável NEXT_PUBLIC_API_URL
#   (a URL pública do app de API daquele ambiente).
on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: 'Ambiente de destino (precisa existir em Settings → Environments com FLY_API_TOKEN)'
        required: true
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ inputs.ambiente }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build e publica as imagens (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.ambiente }}
    outputs:
      api-image: ${{ steps.tags.outputs.api }}
      web-image: ${{ steps.tags.outputs.web }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir tags das imagens
        id: tags
        run: |
          echo "api=ghcr.io/${{ github.repository }}-api:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${{ github.repository }}-web:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build e push — API
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.api }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build e push — web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.web }}
          # NEXT_PUBLIC_* é inlinado no bundle em build time (ver
          # apps/web/Dockerfile) — precisa ser a variável do AMBIENTE
          # escolhido (staging e produção apontam pra APIs diferentes), por
          # isso este job carrega `environment:` acima, não só os de deploy.
          # NEXT_PUBLIC_SENTRY_DSN e SENTRY_ORG/PROJECT são opcionais
          # (roadmap 5.4) — sem configurar como variável do ambiente, o
          # build segue normal com Sentry desligado. SENTRY_AUTH_TOKEN (tem
          # permissão de escrita no Sentry) NÃO entra aqui — vai em
          # `secrets:` abaixo, montado só durante o RUN que precisa dele
          # (ver apps/web/Dockerfile), nunca gravado em camada de imagem.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_NAME=Arbora
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy no Fly.io
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.ambiente }}
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Resolver os fly.toml do ambiente
        id: config
        run: |
          if [ "${{ inputs.ambiente }}" = "staging" ]; then
            echo "api=apps/api/fly.staging.toml" >> "$GITHUB_OUTPUT"
            echo "web=apps/web/fly.staging.toml" >> "$GITHUB_OUTPUT"
          else
            echo "api=apps/api/fly.toml" >> "$GITHUB_OUTPUT"
            echo "web=apps/web/fly.toml" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy — API (release_command roda a migração antes do tráfego trocar)
        run: |
          flyctl deploy \
            --config ${{ steps.config.outputs.api }} \
            --image ${{ needs.build-and-push.outputs.api-image }} \
            --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy — web
        run: |
          flyctl deploy \
            --config ${{ steps.config.outputs.web }} \
            --image ${{ needs.build-and-push.outputs.web-image }} \
            --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
