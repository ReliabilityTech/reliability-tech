name: Deploy

# Disparo manual só, de propósito: publica de verdade em staging/produção no
# Fly.io (roadmap 5.3) — sem revisão automática de push, ninguém quer isso
# disparando sozinho. Trocar pra `push: {tags: ['v*']}` quando o time achar
# que dá pra confiar no automático.
#
# O build das imagens roda no builder remoto do próprio Fly (`flyctl deploy
# --remote-only`), não no GHCR: o Fly não consegue puxar imagem de um pacote
# privado do GHCR ("Authentication required"), e tornar o pacote público só pra
# isso expõe a imagem sem necessidade.
#
# Pré-requisito (uma vez só, fora deste arquivo — ver docs/deploy.md):
# - 2 apps Fly por serviço (reliability-tech-api[-staging],
#   reliability-tech-web[-staging]) e 2 clusters de Postgres, com
#   `fly postgres attach` feito em cada app de API.
# - Um ambiente `staging` e um `production` em Settings → Environments,
#   cada um com o secret FLY_API_TOKEN e a variável NEXT_PUBLIC_API_URL
#   (a URL pública do app de API daquele ambiente).
on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: 'Ambiente de destino (precisa existir em Settings → Environments com FLY_API_TOKEN)'
        required: true
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ inputs.ambiente }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy no Fly.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # NEXT_PUBLIC_* é inlinado no bundle do web em build time (ver
    # apps/web/Dockerfile) — precisa ser a variável do AMBIENTE escolhido
    # (staging e produção apontam pra APIs diferentes).
    environment: ${{ inputs.ambiente }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Falha cedo e com mensagem clara em vez de gastar minutos de build pra
      # descobrir (o Next.js só reclama no `next build`).
      - name: Conferir configuração do ambiente
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Secret FLY_API_TOKEN vazio no environment '${{ inputs.ambiente }}'."
            exit 1
          fi
          if [ -z "${{ vars.NEXT_PUBLIC_API_URL }}" ]; then
            echo "::error::Variable NEXT_PUBLIC_API_URL vazia no environment '${{ inputs.ambiente }}'."
            exit 1
          fi

      - name: Resolver os fly.toml do ambiente
        id: config
        run: |
          if [ "${{ inputs.ambiente }}" = "staging" ]; then
            echo "api=apps/api/fly.staging.toml" >> "$GITHUB_OUTPUT"
            echo "web=apps/web/fly.staging.toml" >> "$GITHUB_OUTPUT"
          else
            echo "api=apps/api/fly.toml" >> "$GITHUB_OUTPUT"
            echo "web=apps/web/fly.toml" >> "$GITHUB_OUTPUT"
          fi

      # --ha=false: o plano do Fly usado aqui tem teto de 3 machines (Postgres +
      # API + web); o padrão do flyctl (2 machines por app) estoura o limite.
      - name: Deploy — API
        run: |
          flyctl deploy \
            --config ${{ steps.config.outputs.api }} \
            --dockerfile apps/api/Dockerfile \
            --remote-only \
            --ha=false

      # Migração depois do rollout, dentro da machine nova (mesma imagem, mesmo
      # DATABASE_URL). Não usamos `release_command` do Fly porque ele exige uma
      # machine extra e o plano tem teto de 3 — ver comentário em apps/api/fly.toml.
      # Se falhar, o job falha: a API nova já está no ar contra o schema antigo,
      # então corrija e rode o workflow de novo (migrate deploy é idempotente).
      - name: Migrar o banco (prisma migrate deploy)
        run: |
          flyctl ssh console \
            --config ${{ steps.config.outputs.api }} \
            -C "apps/api/node_modules/.bin/prisma migrate deploy --schema apps/api/prisma/schema.prisma"

      # NEXT_PUBLIC_SENTRY_DSN e SENTRY_ORG/PROJECT são opcionais (roadmap 5.4):
      # sem configurar como variável do ambiente, o build segue com Sentry
      # desligado. SENTRY_AUTH_TOKEN (permissão de escrita no Sentry) vai como
      # build secret, montado só durante o RUN que precisa dele (ver
      # apps/web/Dockerfile) — nunca vira ARG/ENV nem camada de imagem.
      - name: Deploy — web
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          args=(
            --config "${{ steps.config.outputs.web }}"
            --dockerfile apps/web/Dockerfile
            --remote-only
            --ha=false
            --build-arg "NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}"
            --build-arg "NEXT_PUBLIC_APP_NAME=Arbora"
            --build-arg "NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}"
            --build-arg "SENTRY_ORG=${{ vars.SENTRY_ORG }}"
            --build-arg "SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}"
          )
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            args+=(--build-secret "sentry_auth_token=$SENTRY_AUTH_TOKEN")
          fi
          flyctl deploy "${args[@]}"
