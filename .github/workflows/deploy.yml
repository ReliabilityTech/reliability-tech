name: Deploy

# Disparo manual só, de propósito: ainda não existe staging/produção real
# (roadmap 0.4 — hospedagem — segue em aberto). Builda e publica as imagens
# de qualquer jeito (não depende de 0.4), mas o job `migrate` só roda de
# verdade depois que o ambiente escolhido (Settings → Environments) tiver um
# secret DATABASE_URL configurado — sem isso, ele falha esperando o secret,
# não migra banco nenhum por engano. Trocar pra `push: {tags: ['v*']}` (ou
# `branches: [main]`) quando a Fase 5.3 definir os ambientes de verdade.
on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: 'Ambiente de destino (precisa existir em Settings → Environments com o secret DATABASE_URL)'
        required: true
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ inputs.ambiente }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build e publica as imagens (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      api-image: ${{ steps.tags.outputs.api }}
      web-image: ${{ steps.tags.outputs.web }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir tags das imagens
        id: tags
        run: |
          echo "api=ghcr.io/${{ github.repository }}-api:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${{ github.repository }}-web:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build e push — API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.api }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build e push — web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.web }}
          # NEXT_PUBLIC_* é inlinado no bundle em build time (ver
          # apps/web/Dockerfile) — sem essa var configurada em Settings →
          # Environments → Variables, cai no default de dev (localhost).
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_NAME=Arbora
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Roda as migrações (prisma migrate deploy)
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.ambiente }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: prisma migrate deploy
        run: pnpm db:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy:
    name: Publica a nova versão
    needs: [build-and-push, migrate]
    runs-on: ubuntu-latest
    environment: ${{ inputs.ambiente }}
    steps:
      # Placeholder até a Fase 0.4 decidir onde hospedar — build, push e
      # migração já rodam de verdade acima; falta só apontar pro alvo real
      # (ex.: um `docker compose pull && up` remoto via SSH, um `az/aws/fly
      # deploy`, um rollout de Kubernetes). Ver docs/roadmap.md Fase 5.3.
      - name: Resumo (deploy real ainda não configurado)
        run: |
          echo "Imagens publicadas em ghcr.io:"
          echo "  API: ${{ needs.build-and-push.outputs.api-image }}"
          echo "  Web: ${{ needs.build-and-push.outputs.web-image }}"
          echo "Migração do banco (${{ inputs.ambiente }}) concluída."
          echo "Nenhum alvo de deploy configurado ainda — depende da Fase 0.4/5.3."
