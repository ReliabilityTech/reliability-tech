name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valores fictícios: as etapas abaixo não acessam o banco, mas a validação de
  # ambiente da API exige que as variáveis existam.
  DATABASE_URL: postgresql://arbora:arbora@localhost:5432/arbora
  JWT_SECRET: ci-secret-com-pelo-menos-32-caracteres-ok

jobs:
  verify:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Formatação
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Testes (com cobertura mínima)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build
