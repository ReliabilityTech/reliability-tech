# Dependências de infraestrutura para desenvolvimento local.
# Suba com `pnpm infra:up` e derrube com `pnpm infra:down`.
name: arbora

services:
  postgres:
    image: postgres:17-alpine
    container_name: arbora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arbora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arbora}
      POSTGRES_DB: ${POSTGRES_DB:-arbora}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Impede que a API tente conectar antes de o banco aceitar conexões.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-arbora} -d ${POSTGRES_DB:-arbora}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
